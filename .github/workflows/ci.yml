name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m victor_skill_kernel audit skills --fail-on-high --json audit.json --markdown audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: victor-skill-audit
          path: |
            audit.json
            audit.md
